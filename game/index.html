<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Trot — The Great Thanksgiving Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1a10; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Turkey Trot: run the turkey across the farmyard, the barn and the kitchen, dodge the farmer and the carving knives, and reach the freedom gate"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#fff3d6;font-family:sans-serif;text-align:center">Turkey Trot needs JavaScript to play.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
